name: Validate Supplier JSON

on:
  pull_request:
    paths:
      - data/iphone_suppliers.json
      - scripts/validate_suppliers.py

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate iphone_suppliers.json
        run: python scripts/validate_suppliers.py
